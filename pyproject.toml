[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-pit"
version = "0.1.0"
description = "Layered point-in-time checks for ML pipelines written by coding agents"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
parquet = ["pyarrow"]
test = ["pytest", "pyarrow", "scikit-learn"]

[project.scripts]
strata = "strata.cli:main"

[tool.setuptools]
packages = ["strata"]
